name: Build APK
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
      - name: Create skeleton
        run: flutter config --no-analytics && mkdir -p /tmp/skel && cd /tmp/skel && flutter create --org com.garshasb --project-name med_reminder app && cp -r app/android $GITHUB_WORKSPACE/android
      - name: Install dependencies
        run: flutter clean && flutter pub get
      - name: Build APK
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MedReminder-APK
          path: build/app/outputs/flutter-apk/app-release.apk
