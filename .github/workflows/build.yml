name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'

      - name: Create Flutter skeleton
        run: |
          flutter config --no-analytics
          mkdir -p /tmp/skeleton
          cd /tmp/skeleton
          flutter create --org com.garshasb --project-name med_reminder skeleton_app
          cp -r skeleton_app/android $GITHUB_WORKSPACE/android

      - name: Install dependencies
        run: |
          flutter clean
          flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MedReminder-APK
          path: build/app/outputs/flutter-apk/app-release.apk
        run: flutter build apk --split-per-abi=false

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MedReminder-APK
          path: build/app/outputs/flutter-apk/app-release.apk
